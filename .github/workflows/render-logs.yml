name: render-logs

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Render events and logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SVC: srv-dbf5hbnavr4c73ct2bq0
        run: |
          set -e
          OWNER_ID=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/owners" \
            | python3 -c "import json,sys;rows=json.load(sys.stdin);o=rows[0].get('owner',rows[0]);print(o.get('id',''))")
          echo "=== статусы деплоев ==="
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SVC/deploys?limit=5" \
            | python3 -c "
          import json,sys
          for row in json.load(sys.stdin):
              d = row.get('deploy', row)
              print('-', d.get('id'), d.get('status'), d.get('createdAt'), '->', d.get('finishedAt'))
          "
          echo "=== healthz ==="
          URL=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SVC" \
            | python3 -c "import json,sys
          d=json.load(sys.stdin);obj=d.get('service',d);details=obj.get('serviceDetails') or {}
          print(details.get('url',''))")
          echo "URL: $URL"
          curl -s -o /dev/null -w "healthz: %{http_code}\n" --max-time 20 "$URL/healthz" || true
          echo "=== события сервиса (сырые) ==="
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SVC/events?limit=6" > events_raw.json
          python3 -c "import json;print(json.dumps(json.load(open('events_raw.json')), indent=1)[:3000])"
          echo "=== логи сервиса ==="
          START=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ)
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/logs?ownerId=$OWNER_ID&resource=$SVC&limit=100&startTime=$START&type=app&type=build" \
            > logs_raw.json
          python3 - <<'PY'
          import json
          data = json.load(open('logs_raw.json'))
          if isinstance(data, dict) and 'logs' in data:
              print('hasMore:', data.get('hasMore'))
              for row in data['logs']:
                  item = row.get('log', row)
                  print(item.get('timestamp', ''), item.get('level', ''), item.get('message', '')[:250])
          else:
              print('RAW:', json.dumps(data, ensure_ascii=False)[:1500])
          PY
