name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render healthz
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://telegram-assistant-v8pj.onrender.com/healthz || true)
          echo "healthz: $CODE"
          test "$CODE" = "200"
